name: Ota V11.22 Flowise Upgrade Pressure

on:
  push:
    branches:
      - bobai/v11.22-flowise-upgrade-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-upgrade:
    name: Flowise legacy upgrade (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: macos
            runner: macos-latest
    steps:
      - name: Checkout pressure controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Core build toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Install exact Ota revision
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          source: contract
          contract-path: .ota-pressure/ota.yaml

      - name: Checkout historical Flowise fixture
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: FlowiseAI/Flowise
          ref: 90121fac54e234ca83e2a85c435354af1df8ac8f
          path: flowise
          fetch-depth: 1
          persist-credentials: false

      - name: Upgrade and commit only the reviewed contract
        working-directory: flowise
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ota/candidates .ota/pressure
          git switch -c ota-pressure-fixture
          git config user.name 'Ota pressure'
          git config user.email 'ota-pressure@example.invalid'
          ota --version --json > .ota/pressure/ota-version.json
          git rev-parse HEAD > .ota/pressure/repository-revision.txt
          test "$(cat .ota/pressure/repository-revision.txt)" = "90121fac54e234ca83e2a85c435354af1df8ac8f"
          git show HEAD:ota.yaml > .ota/pressure/before-ota.yaml

          ota contract upgrade --candidate-out .ota/candidates/flowise.json --json > .ota/pressure/upgrade.json
          ota contract apply-candidate .ota/candidates/flowise.json --json > .ota/pressure/dry-run.json
          ota contract apply-candidate .ota/candidates/flowise.json --write --carrier git --json > .ota/pressure/apply.json
          ota validate --json > .ota/pressure/validate.json
          commit=$(git rev-parse HEAD)
          git diff-tree --no-commit-id --name-only -r "$commit" > .ota/pressure/commit-paths.txt
          ota contract apply-candidate .ota/candidates/flowise.json --write --carrier git --json > .ota/pressure/no-op.json
          test "$commit" = "$(git rev-parse HEAD)"

          node <<'NODE'
          const fs = require('fs');
          const candidate = JSON.parse(fs.readFileSync('.ota/candidates/flowise.json', 'utf8'));
          const dryRun = JSON.parse(fs.readFileSync('.ota/pressure/dry-run.json', 'utf8'));
          const applied = JSON.parse(fs.readFileSync('.ota/pressure/apply.json', 'utf8'));
          const noOp = JSON.parse(fs.readFileSync('.ota/pressure/no-op.json', 'utf8'));
          const validated = JSON.parse(fs.readFileSync('.ota/pressure/validate.json', 'utf8'));
          const paths = fs.readFileSync('.ota/pressure/commit-paths.txt', 'utf8').trim().split('\n').filter(Boolean);
          if (candidate.kind !== 'upgrade' || candidate.schema_version !== 2 ||
              candidate.migration?.id !== 'legacy_flat_toolchain_fulfillment_v1' ||
              candidate.migration.before_semantic_identity !== candidate.migration.after_semantic_identity) {
            throw new Error('Flowise candidate was not the registered lossless migration');
          }
          if (!dryRun.ok || dryRun.written || !applied.ok || !applied.written || !validated.ok) {
            throw new Error('Flowise candidate did not complete reviewed Git-carrier application');
          }
          if (paths.length !== 1 || paths[0] !== 'ota.yaml') {
            throw new Error('Flowise Git carrier committed paths other than ota.yaml');
          }
          if (!noOp.ok || noOp.written || !noOp.no_op) {
            throw new Error('Flowise candidate did not reapply as an exact semantic no-op');
          }
          fs.writeFileSync('.ota/pressure/summary.json', JSON.stringify({
            core_revision: 'cf9d734d749cfb1259cc8249f9cc88e36bb1e00d',
            upstream_revision: '90121fac54e234ca83e2a85c435354af1df8ac8f',
            candidate_identity: candidate.identity,
            before_semantic_identity: candidate.migration.before_semantic_identity,
            after_semantic_identity: candidate.migration.after_semantic_identity,
            git_commit: applied.git_commit,
            no_op: noOp.no_op
          }, null, 2) + '\n');
          NODE

      - name: Archive pressure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowise-v11-22-${{ matrix.target }}
          path: flowise/.ota
          if-no-files-found: error
          include-hidden-files: true
